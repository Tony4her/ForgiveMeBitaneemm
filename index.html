<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Özür Dilerim</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Trebuchet MS', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#ffb6d9,#ffd6ea,#fff0f6);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* ANIME PARILTISI */

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 12px
    );
    animation:bgMove 15s linear infinite;
}

@keyframes bgMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-200px,-200px);
    }
}

/* KALPLER */

.hearts,.petals{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.heart,.petal{
    position:absolute;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

.heart{
    color:rgba(255,0,90,0.25);
    animation-name:float;
}

.petal{
    color:rgba(255,182,193,0.7);
    animation-name:petalFloat;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-120px) rotate(360deg);
    }
}

@keyframes petalFloat{
    from{
        transform:translateY(-100px) translateX(0) rotate(0deg);
    }
    to{
        transform:translateY(110vh) translateX(100px) rotate(360deg);
    }
}

/* CONTAINER */

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:420px;

    padding:35px;
    border-radius:30px;

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.4);

    box-shadow:
    0 0 30px rgba(255,80,130,0.35),
    0 10px 40px rgba(0,0,0,0.15);

    text-align:center;

    animation:containerPop 1s ease;
}

@keyframes containerPop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.aot{
    font-size:14px;
    color:#ff2d75;
    margin-bottom:10px;
    letter-spacing:2px;
    animation:flicker 2s infinite;
}

@keyframes flicker{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.5;
    }
}

h1{
    color:#ff2d75;
    font-size:34px;
    margin-bottom:15px;

    text-shadow:
    0 0 10px rgba(255,0,100,0.4);
}

.subtitle{
    color:#444;
    font-size:18px;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
    transition:.35s;
}

/* KIRMIZI */

#forgiveBtn{
    padding:16px 28px;
    border-radius:18px;
    font-size:15px;
    background:#ff2d55;
    color:white;

    box-shadow:
    0 0 20px rgba(255,45,85,.5);

    transform-origin:center center;
}

/* YEŞİL */

#noBtn{
    
    padding:16px 28px;
    border-radius:18px;
    font-size:15px;
    background:#27ae60;
    color:white;

    opacity:.9;

    transition:.35s;
}

/* MESAJ */

.message{
    margin-top:40px;
    min-height:40px;

    font-size:20px;
    font-weight:bold;

    color:#ff2d75;

    animation:fade .3s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* FINAL */

.final-screen{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle,#ff4b7d,#ff174f);

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;

    z-index:9999;

    padding:30px;

    flex-direction:column;

    animation:finalAnim .5s ease;
}

.final-content{
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.final-screen h2{
    font-size:42px;
    margin-bottom:20px;

    text-shadow:
    0 0 20px rgba(255,255,255,.5);
}

.final-screen p{
    font-size:24px;
    line-height:1.6;
    color:white;
}

@keyframes finalAnim{
    from{
        transform:scale(.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.boom-heart{
    position:fixed;
    font-size:24px;
    pointer-events:none;
    z-index:999999;

    animation:boom 1s ease forwards;
}

@keyframes boom{

    0%{
        transform:scale(.5);
        opacity:1;
    }

    100%{
        transform:
        translate(
            calc(var(--x) * 1px),
            calc(var(--y) * 1px)
        )
        scale(2);

        opacity:0;
    }
}

@keyframes floatText{
    0%{
        transform:translateY(100vh) rotate(0deg);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-20vh) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="hearts"></div>
<div class="petals"></div>

<div class="container">

    <div class="aot">
        ⚡ Misaka missed you too ⚡
    </div>

    <h1>Özür Dilerim 🥺</h1>

    <div class="subtitle">
        Nolur beni affet...
    </div>

    <div class="buttons">
        <button id="forgiveBtn">🤍Bir daha olmasın</button>
        <button id="noBtn">Avcunu Yala</button>
    </div>

    <div class="message" id="message"></div>

</div>

<div class="final-screen" id="finalScreen">
    <div class="final-content">
        <h2>🤍 Seni Çooooook Seviyoruuummmmm 🤍</h2>

        <p>
            Gerçekten çok özür dilerim...<br>
            Sen üzülünce içimde bir parçam kopuyor 🥺
        </p>
    </div>
</div>

<script>

const noBtn = document.getElementById("noBtn");
const forgiveBtn = document.getElementById("forgiveBtn");
const message = document.getElementById("message");
const finalScreen = document.getElementById("finalScreen");

let clickCount = 0;
let scale = 1;
let noScale = 1;

function vibrate(ms){
    if(navigator.vibrate){
        navigator.vibrate(ms);
    }
}

noBtn.addEventListener("click",()=>{

    vibrate([100,50,100]);

    clickCount++;

    /* NORMAL BÜYÜME */

    if(clickCount < 3){

        scale += 0.35;
        noScale -= 0.15;

        if(noScale < 0){
            noScale = 0;
        }

        forgiveBtn.style.transform =
        `scale(${scale})`;

        noBtn.style.transform =
        `scale(${noScale})`;
    }

    /* YAZILAR */

    if(clickCount === 1){

        message.innerText =
        "Elin çarptı galiba 😌";
    }

    else if(clickCount === 2){

        message.innerText =
        "En sevdiğin renk mi değişti ne 👉👈";
    }

    /* FULL SCREEN */

    else if(clickCount >= 3){

        message.innerText = "";

        /* SCALE TEMİZLE */
        forgiveBtn.style.removeProperty("transform");

        /* TAM EKRAN */
        forgiveBtn.style.position = "fixed";

        forgiveBtn.style.top = "0";
        forgiveBtn.style.left = "0";

        forgiveBtn.style.width = "100vw";
        forgiveBtn.style.height = "100vh";

        forgiveBtn.style.top = "50%";
forgiveBtn.style.left = "50%";

forgiveBtn.style.translate = "-50% -50%";

        /* FLEX CENTER */
forgiveBtn.style.display = "grid";
forgiveBtn.style.placeItems = "center";

forgiveBtn.style.textAlign = "center";

forgiveBtn.style.position = "fixed";


forgiveBtn.style.width = "100vw";
forgiveBtn.style.height = "100vh";

forgiveBtn.style.padding = "0";
forgiveBtn.style.margin = "0";

forgiveBtn.style.border = "none";
forgiveBtn.style.borderRadius = "0";

forgiveBtn.style.transform = "none";

forgiveBtn.style.fontSize = "72";
forgiveBtn.style.lineHeight = "1";

forgiveBtn.style.whiteSpace = "nowrap";

forgiveBtn.style.zIndex = "99999";

        /* TEXT CENTER */
        forgiveBtn.style.textAlign = "center";

        /* RESET */
        forgiveBtn.style.padding = "0";
        forgiveBtn.style.margin = "0";

        forgiveBtn.style.borderRadius = "0";

        /* FONT */
        forgiveBtn.style.fontSize = "10vw";
        forgiveBtn.style.lineHeight = "1.2";

        /* FIX */
        forgiveBtn.style.whiteSpace = "nowrap";

        forgiveBtn.style.zIndex = "99999";

        /* BUTTON RESET */
        forgiveBtn.style.minWidth = "100vw";
        forgiveBtn.style.minHeight = "100vh";

        /* YEŞİLİ GİZLE */
        noBtn.style.display = "none";
    }
});

forgiveBtn.addEventListener("click",()=>{

    vibrate([200,100,200]);

    finalScreen.style.display = "flex";
});

/* KALPLER */

const heartsContainer = document.querySelector(".hearts");

for(let i=0;i<30;i++){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤";

    heart.style.left = Math.random()*100+"vw";

    heart.style.fontSize =
    (18 + Math.random()*30)+"px";

    heart.style.animationDuration =
    (4 + Math.random()*5)+"s";

    heart.style.animationDelay =
    Math.random()*5+"s";

    heartsContainer.appendChild(heart);
}

/* SAKURA */

const petalsContainer = document.querySelector(".petals");

for(let i=0;i<25;i++){

    const petal = document.createElement("div");

    petal.classList.add("petal");

    petal.innerHTML = "🌸";

    petal.style.left = Math.random()*100+"vw";

    petal.style.fontSize =
    (16 + Math.random()*24)+"px";

    petal.style.animationDuration =
    (5 + Math.random()*7)+"s";

    petal.style.animationDelay =
    Math.random()*5+"s";

    petalsContainer.appendChild(petal);
}

const textContainer = document.querySelector("body");

for(let i=0;i<12;i++){

    const txt = document.createElement("div");

    txt.innerText = "ÖKÇ";

    txt.style.position = "fixed";
    txt.style.left = Math.random()*100 + "vw";
    txt.style.top = Math.random()*100 + "vh";

    txt.style.fontSize = (18 + Math.random()*25) + "px";
    txt.style.color = "rgba(255,105,180,0.6)";
    txt.style.fontWeight = "bold";
    txt.style.pointerEvents = "none";
    txt.style.zIndex = "1";

    txt.style.animation = "floatText 6s linear infinite";

    document.body.appendChild(txt);
}

const music = document.getElementById("bgMusic");

document.body.addEventListener("click", () => {
    music.play();
}, { once:true });

document.addEventListener("click",(e)=>{

    for(let i=0;i<12;i++){

        const heart =
        document.createElement("div");

        heart.className = "boom-heart";

        heart.innerHTML = Math.random() > .5
        ? "❤"
        : "🌸";

        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";

        heart.style.setProperty(
            "--x",
            (Math.random() - .5) * 300
        );

        heart.style.setProperty(
            "--y",
            (Math.random() - .5) * 300
        );

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },1000);
    }

});



function enableMusic(){
    music.volume = 0.4;

    const playPromise = music.play();

    if(playPromise !== undefined){
        playPromise.catch((e)=>{
            console.log("Autoplay blocked:", e);
        });
    }

    document.removeEventListener("click", enableMusic);
    document.removeEventListener("touchstart", enableMusic);
}

document.addEventListener("click", enableMusic);
document.addEventListener("touchstart", enableMusic);
</script>

</body>
</html>
